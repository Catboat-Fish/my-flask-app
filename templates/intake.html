<!DOCTYPE html>
<!--TODO: add button hover feature that stands out but isn't distracting-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Input Intake</title>

    <style>
        :root {
            color-scheme: dark;

            --background: #111827;
            --surface: #1f2937;
            --text: #f9fafb;
            --border: #6b7280;
            --button: #3b82f6;
            --button-text: #ffffff;
            --error: #fca5a5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 600px);
            margin: 0 auto;
            padding: 2rem;
            background: var(--surface);
            border-radius: 12px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--background);
            color: var(--text);
            font: inherit;
            resize: vertical;
        }

        textarea:focus,
        button:focus {
            outline: 3px solid color-mix(
                in srgb,
                var(--button) 50%,
                transparent
            );
            outline-offset: 2px;
        }

        button {
            padding: 0.7rem 1.2rem;
            border: 0;
            border-radius: 6px;
            background: var(--button);
            color: var(--button-text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.2);
        }

        [role="alert"] {
            color: var(--error);
            font-weight: 600;
        }
    </style>

</head>
<body>
    <main>
        <h1>Enter a Message</h1>

        <p>
            Note: any message you submit will only be shown to you. The developer of this page will not be able to see any of your messages.
        </p>
        
        <form method="post">
            <label for="intake">Type your message below</label>

            <textarea
                id="intake"
                name="intake"
                rows="5"
                maxlength="500"
                required
            ></textarea>

            <button type="submit">Submit</button>
        </form>

        {% if error %}
            <p role="alert">{{ error }}</p>
        {% endif %}

        {% if message %}
            <h2>Submitted message</h2>
            <p>{{ message }}</p>
        {% endif %}
    </main>
</body>
</html>
